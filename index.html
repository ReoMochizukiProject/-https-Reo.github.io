<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>参加管理ツール</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background-color:#111;
background-image:radial-gradient(rgba(255, 140, 0, 0.35) 2px, transparent 2px);
background-size:24px 24px;
color:#fff;
font-family:sans-serif;
padding-bottom:130px;
}

header{
padding:20px;
}

.hero{
position:relative;
height:250px;
overflow:hidden;
border-radius:12px;
}

.hero img{
width:100%;
height:100%;
object-fit:cover;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.45);
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
font-weight:bold;
}

.googleConnect{
margin-top:20px;
display:flex;
gap:10px;
flex-wrap:wrap;
align-items:center;
}

button{
cursor:pointer;
border:none;
border-radius:8px;
padding:20px;
margin:3px
}

.loginBtn{
background:#4285F4;
color:#fff;
}

.connectBtn{
background:#0F9D58;
color:#fff;
}

.urlInput{
padding:10px;
border-radius:8px;
border:1px solid #444;
background:#222;
color:#fff;
min-width:260px;
flex:1;
max-width:450px;
}

.status{
padding:10px;
border-radius:8px;
background:#222;
}

main{
padding:20px;
}

.slide{
display:flex;
margin-bottom:20px;
overflow:hidden;
border-radius:999px;
border:1px solid rgba(255,255,255,.1);
}

.modeBtn{
flex:1;
padding:12px;
font-weight:bold;
color:#fff;
}

.blue{
background:#1976D2;
}

.red{
background:#C62828;
}

.orange{
background:#EF6C00;
}

.activeMode{
outline:3px solid white;
}

.tools{
margin-bottom:20px;
display:flex;
flex-wrap:wrap;
}

.section{
background:rgba(27, 27, 27, 0.92);
padding:15px;
border-radius:12px;
margin-bottom:20px;
border:1px solid rgba(255, 140, 0, 0.2);
}

.section h2{
margin-bottom:10px;
}

.person{
display:flex;
justify-content:space-between;
align-items:center;
background:#2a2a2a;
border-radius:8px;
padding:10px;
margin-bottom:8px;
cursor:pointer;
}

.person:hover{
background:#363636;
}

.counter{
display:flex;
gap:8px;
align-items:center;
}

.counter button{
width:30px;
height:30px;
padding:0;
}

.count0{
color:white;
}

.count1{
color:orange;
}

.count2{
color:red;
}

.waitingCount{
font-size:14px;
opacity:0.8;
}

.deleted{
display:none;
}

.showDeleted{
display:block;
}

/* 追従キャラクターバナー */
.charaBanner{
position:fixed;
bottom:20px;
right:20px;
display:flex;
align-items:flex-end;
gap:12px;
z-index:1000;
pointer-events:none;
}

.speechBubble{
position:relative;
background:#fff;
color:#111;
padding:12px 16px;
border-radius:16px;
font-size:14px;
font-weight:bold;
line-height:1.4;
max-width:240px;
box-shadow:0 6px 20px rgba(0,0,0,0.6);
border:3px solid #FF8C00;
opacity:0;
transform:translateY(10px) scale(0.95);
animation:bubblePop 0.4s ease-out 0.9s forwards;
pointer-events:auto;
}

.speechBubble::after{
content:"";
position:absolute;
right:-12px;
bottom:18px;
border-style:solid;
border-width:8px 0 8px 12px;
border-color:transparent transparent transparent #FF8C00;
}

.charaAvatar{
width:76px;
height:76px;
border-radius:50%;
background:linear-gradient(135deg, #FF9800, #EF6C00);
border:3px solid #fff;
box-shadow:0 6px 20px rgba(0,0,0,0.6);
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
pointer-events:auto;
cursor:pointer;
animation:spinEnter 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

.charaAvatar img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.charaSpin{
animation:spinReact 0.5s ease-in-out;
}

@keyframes spinEnter{
0%{
    transform:translateX(160px) rotate(-720deg) scale(0.5);
    opacity:0;
}
100%{
    transform:translateX(0) rotate(0deg) scale(1);
    opacity:1;
}
}

@keyframes spinReact{
0%{
    transform:rotate(0deg) scale(1);
}
50%{
    transform:rotate(180deg) scale(1.12);
}
100%{
    transform:rotate(360deg) scale(1);
}
}

@keyframes bubblePop{
to{
    opacity:1;
    transform:translateY(0) scale(1);
}
}

@media(max-width:768px){
.person{
    flex-direction:column;
    align-items:flex-start;
    gap:10px;
}

.counter{
    width:100%;
    justify-content:flex-end;
}

.charaBanner{
    bottom:12px;
    right:12px;
    gap:8px;
}

.speechBubble{
    font-size:12px;
    padding:10px 12px;
    max-width:190px;
}

.charaAvatar{
    width:62px;
    height:62px;
}
}
</style>
</head>

<body>

<header>

<div class="googleConnect">
<button class="loginBtn" id="loginBtn">
Googleでログイン
</button>

<input type="text" class="urlInput" id="liveUrlInput" placeholder="YouTube配信のURLを貼り付け">

<button class="connectBtn" id="connectBtn">
チャット取得開始
</button>

<div class="status" id="status">
未接続
</div>
</div>

</header>

<main>

<div class="slide">
<button class="modeBtn blue activeMode" data-mode="blue">
参加管理
</button>
<button class="modeBtn red" data-mode="red">
削除
</button>
<button class="modeBtn orange" data-mode="orange">
復元
</button>
</div>

<div class="tools">
<button id="battleBtn">
全員対戦＋1
</button>
<button id="priorityBtn">
先頭を参加中へ
</button>
</div>

<div class="section">
<h2>参加中（最大5人）</h2>
<div id="joinList"></div>
</div>

<div class="section">
<h2>待機中</h2>
<div id="waitingList"></div>
</div>

<div class="section deleted" id="deletedArea">
<h2>削除履歴</h2>
<div id="deletedList"></div>
</div>

</main>

<!-- 追従キャラクターバナー -->
<div class="charaBanner" id="charaBanner">
<div class="speechBubble" id="charaSpeech">
</div>
<div class="charaAvatar" id="charaAvatar" title="クリックでくるっと回転">
<!-- ▼ ここの src="" の中に用意したキャラクター画像のパスやURLを貼り付けてください ▼ -->
<img id="charaImg" src="character.png" alt="キャラクター">
</div>
</div>

<script>
const CLIENT_ID = "686808933417-dauea23l9ieg66v3jrbun6mdur3oq29p.apps.googleusercontent.com";

let mode = "blue";
let accessToken = "";
let liveChatId = "";
let nextPageToken = "";
let pollingTimer = null;
let tokenClient = null;

const joinList = JSON.parse(localStorage.getItem("joinList") || "[]");
const waitingList = JSON.parse(localStorage.getItem("waitingList") || "[]");
const deletedList = JSON.parse(localStorage.getItem("deletedList") || "[]");

const modeSpeeches = {
blue: "【参加管理モード】待機中と参加中をクリックで入れ替えられるよ！",
red: "【削除モード】リストの名前をクリックすると削除できるよ！",
orange: "【復元モード】削除履歴から名前をクリックして参加中へ戻せるよ！"
};

function updateCharaSpeech(text, spin = true){
const speechEl = document.querySelector("#charaSpeech");
const avatarEl = document.querySelector("#charaAvatar");
speechEl.textContent = text;

if(spin){
    avatarEl.classList.remove("charaSpin");
    void avatarEl.offsetWidth;
    avatarEl.classList.add("charaSpin");
}
}

document.querySelector("#charaAvatar").onclick = ()=>{
updateCharaSpeech(modeSpeeches[mode], true);
};

function save(){
localStorage.setItem("joinList", JSON.stringify(joinList));
localStorage.setItem("waitingList", JSON.stringify(waitingList));
localStorage.setItem("deletedList", JSON.stringify(deletedList));
}

function countClass(count){
if(count >= 2){
    return "count2";
}
if(count === 1){
    return "count1";
}
return "count0";
}

function render(){
const join = document.querySelector("#joinList");
join.innerHTML = "";

joinList.forEach(player=>{
    const div = document.createElement("div");
    div.className = "person";
    div.innerHTML = `
    <div class="${countClass(player.count)}">
        ${player.name}
    </div>
    <div class="counter">
        <button onclick="event.stopPropagation(); changeCount('${player.id}',-1)">&lt;</button>
        ${player.count}
        <button onclick="event.stopPropagation(); changeCount('${player.id}',1)">&gt;</button>
    </div>
    `;

    div.onclick = ()=>{
        if(mode === "blue"){
            moveToWaiting(player.id);
        } else if(mode === "red"){
            removePlayer(player.id, "join");
        }
    };

    join.appendChild(div);
});

const waiting = document.querySelector("#waitingList");
waiting.innerHTML = "";

waitingList.forEach(player=>{
    const div = document.createElement("div");
    div.className = "person";
    div.innerHTML = `
    <div class="${countClass(player.count)}">
        ${player.name}
    </div>
    <div class="waitingCount">
        対戦数: ${player.count}
    </div>
    `;

    div.onclick = ()=>{
        if(mode === "blue"){
            moveToJoin(player.id);
        } else if(mode === "red"){
            removePlayer(player.id, "waiting");
        }
    };

    waiting.appendChild(div);
});

const deleted = document.querySelector("#deletedList");
deleted.innerHTML = "";

deletedList.forEach(player=>{
    const div = document.createElement("div");
    div.className = "person";
    div.innerHTML = `
    <div class="${countClass(player.count)}">
        ${player.name}
    </div>
    <div class="waitingCount">
        対戦数: ${player.count}
    </div>
    `;

    div.onclick = ()=>{
        if(mode === "orange"){
            restorePlayer(player.id);
        }
    };

    deleted.appendChild(div);
});

save();
}

function moveToJoin(id){
if(joinList.length >= 5){
    updateCharaSpeech("参加中は最大5人までだよ！誰かを待機中へ戻してね。", false);
    return;
}
const index = waitingList.findIndex(x=>x.id===id);
if(index===-1){
    return;
}
const player = waitingList[index];
joinList.push(player);
waitingList.splice(index,1);
updateCharaSpeech(`${player.name}さんを参加中へ移動したよ！`, false);
render();
}

function moveToWaiting(id){
const index = joinList.findIndex(x=>x.id===id);
if(index===-1){
    return;
}
const player = joinList[index];
waitingList.push(player);
joinList.splice(index,1);
updateCharaSpeech(`${player.name}さんを待機中へ戻したよ！（対戦数: ${player.count}）`, false);
render();
}

function removePlayer(id, source = "join"){
const list = source === "join" ? joinList : waitingList;
const index = list.findIndex(x=>x.id===id);
if(index===-1){
    return;
}
const player = list[index];
deletedList.unshift(player);
if(deletedList.length > 5){
    deletedList.length = 5;
}
list.splice(index,1);
updateCharaSpeech(`${player.name}さんを削除履歴へ移したよ。`, false);
render();
}

function restorePlayer(id){
if(joinList.length >= 5){
    updateCharaSpeech("参加中がいっぱいだよ！空きを作ってから復元してね。", false);
    return;
}
const index = deletedList.findIndex(x=>x.id===id);
if(index===-1){
    return;
}
const player = deletedList[index];
joinList.push(player);
deletedList.splice(index,1);
updateCharaSpeech(`${player.name}さんを参加中へ復元したよ！`, false);
render();
}

function changeCount(id,value){
const player = joinList.find(x=>x.id===id);
if(!player){
    return;
}
player.count = Math.max(0, player.count + value);
render();
}

document.querySelector("#battleBtn").onclick = ()=>{
joinList.forEach(x=>{
    x.count++;
});
updateCharaSpeech("参加中メンバー全員の対戦数を＋1したよ！", true);
render();
};

document.querySelector("#priorityBtn").onclick = ()=>{
if(waitingList.length===0){
    updateCharaSpeech("待機中のプレイヤーがいないみたい！", false);
    return;
}
moveToJoin(waitingList[0].id);
};

document.querySelectorAll(".modeBtn").forEach(btn=>{
btn.onclick = ()=>{
    document.querySelectorAll(".modeBtn").forEach(x=>x.classList.remove("activeMode"));
    btn.classList.add("activeMode");
    mode = btn.dataset.mode;
    document.querySelector("#deletedArea").classList.toggle("showDeleted", mode==="orange");
    updateCharaSpeech(modeSpeeches[mode], true);
};
});

function addWaitingPlayer(id,name){
const exists = waitingList.some(x=>x.id===id) || joinList.some(x=>x.id===id);
if(exists){
    return;
}
const deletedIndex = deletedList.findIndex(x=>x.id===id);
if(deletedIndex !== -1){
    deletedList.splice(deletedIndex, 1);
}
waitingList.push({
    id,
    name,
    count: 0
});
updateCharaSpeech(`${name}さんが待機中に参加したよ！`, true);
render();
}

function extractVideoId(url){
try {
    const u = new URL(url.trim());
    if(u.hostname.includes("youtu.be")){
        return u.pathname.slice(1);
    }
    if(u.searchParams.has("v")){
        return u.searchParams.get("v");
    }
    if(u.pathname.includes("/live/")){
        return u.pathname.split("/live/")[1].split("/")[0];
    }
} catch(e) {
    if(/^[a-zA-Z0-9_-]{11}$/.test(url.trim())){
        return url.trim();
    }
}
return null;
}

function initGoogleAuth(){
if(typeof google === "undefined" || !google.accounts || !google.accounts.oauth2){
    return false;
}
if(!tokenClient){
    tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: "https://www.googleapis.com/auth/youtube.readonly",
        callback: (response)=>{
            if(response.error){
                document.querySelector("#status").textContent = "ログイン失敗: " + response.error;
                return;
            }
            accessToken = response.access_token;
            document.querySelector("#status").textContent = "ログイン完了（URLを入力してください）";
        }
    });
}
return true;
}

window.addEventListener("load", ()=>{
initGoogleAuth();
});

document.querySelector("#loginBtn").onclick = ()=>{
const statusEl = document.querySelector("#status");
if(!initGoogleAuth()){
    statusEl.textContent = "Google認証ライブラリ読込中...数秒後に再試行してください";
    return;
}
try {
    tokenClient.requestAccessToken();
} catch(err) {
    statusEl.textContent = "ログイン起動エラー: " + err.message;
    console.error(err);
}
};

document.querySelector("#connectBtn").onclick = async ()=>{
const statusEl = document.querySelector("#status");

if(!accessToken){
    statusEl.textContent = "先にGoogleでログインしてください";
    return;
}

const url = document.querySelector("#liveUrlInput").value;
const videoId = extractVideoId(url);

if(!videoId){
    statusEl.textContent = "正しいYouTubeのURLを入力してください";
    return;
}

if(pollingTimer){
    clearTimeout(pollingTimer);
    nextPageToken = "";
}

statusEl.textContent = "配信情報を取得中...";
await getLiveChatByVideoId(videoId);
};

async function getLiveChatByVideoId(videoId){
const statusEl = document.querySelector("#status");

try {
    const videoRes = await fetch(
        `https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails&id=${videoId}`,
        {
            headers:{
                Authorization: `Bearer ${accessToken}`
            }
        }
    );

    const videoData = await videoRes.json();

    if(!videoData.items?.length){
        statusEl.textContent = "動画が見つかりません";
        return;
    }

    const details = videoData.items[0].liveStreamingDetails;
    if(!details || !details.activeLiveChatId){
        statusEl.textContent = "配信中ではないか、チャットが無効です";
        return;
    }

    liveChatId = details.activeLiveChatId;
    statusEl.textContent = "チャット取得中...";
    startPolling();

} catch(err) {
    statusEl.textContent = "通信エラーが発生しました";
    console.error(err);
}
}

async function startPolling(){
const params = new URLSearchParams();
params.set("liveChatId", liveChatId);
params.set("part", "snippet,authorDetails");

if(nextPageToken){
    params.set("pageToken", nextPageToken);
}

try {
    const res = await fetch(
        `https://www.googleapis.com/youtube/v3/liveChat/messages?${params}`,
        {
            headers:{
                Authorization: `Bearer ${accessToken}`
            }
        }
    );

    const data = await res.json();

    if(data.error){
        document.querySelector("#status").textContent = "取得エラー: " + data.error.message;
        return;
    }

    nextPageToken = data.nextPageToken;

    data.items?.forEach(item=>{
        const message = item.snippet.displayMessage;
        const name = item.authorDetails.displayName;
        const id = item.authorDetails.channelId;

        if(message.includes("参加希望")){
            addWaitingPlayer(id, name);
        }
    });

    pollingTimer = setTimeout(
        startPolling,
        data.pollingIntervalMillis || 5000
    );
} catch(err) {
    console.error(err);
    pollingTimer = setTimeout(startPolling, 5000);
}
}

render();
</script>

</body>
</html>
